<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beats Desafio - Pose de Craque</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Impact', 'Arial Black', 'sans-serif'] }, colors: { 'beats-yellow': '#e8d533', 'beats-green': '#0e4b21' } } }
    }
  </script>
  <style>
    body { background-color: #0c310c; margin: 0; }
    .animate-fadeIn { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  </style>
</head>
<body>
  <main class="h-[100dvh] font-sans relative selection:bg-beats-yellow/30 flex flex-col p-4 sm:p-6 md:p-8 overflow-hidden text-white z-0 w-full">
    <div class="fixed inset-0 opacity-[0.03] pointer-events-none mix-blend-overlay z-50"></div>
    <div class="fixed opacity-[0.5] inset-0 z-[-20] bg-cover bg-center bg-no-repeat bg-[#0f3f1e]" style="background-image: url('./background.png')"></div>

    <div class="flex-1 flex flex-col z-10 relative min-h-0 w-full">
      <div class="w-full h-full max-w-md mx-auto px-2 sm:px-4 flex flex-col z-10">
        
        <div class="w-full text-center z-20 pointer-events-none shrink-0 pt-2 sm:pt-4">
          <h2 class="text-[26px] sm:text-[32px] md:text-[40px] font-display font-black italic uppercase tracking-tighter text-white drop-shadow-xl leading-tight">
            CUMPRA O DESAFIO
          </h2>
        </div>

        <div class="flex-1 flex flex-col justify-center items-center relative w-full pb-4 sm:pb-8">
          <!-- Challenge Card -->
          <div id="challenge-card" class="w-full flex flex-col bg-black/40 border border-white/20 p-6 sm:p-8 rounded-[2rem] backdrop-blur-md shadow-2xl relative overflow-hidden transition-all duration-300">
            <div class="absolute top-[-50px] left-[-50px] w-[150px] h-[150px] bg-beats-yellow rounded-full blur-[80px] opacity-20 pointer-events-none"></div>

            <div class="flex flex-col items-center text-center z-10">
              <h3 class="text-3xl sm:text-4xl font-black italic uppercase tracking-tight text-white mb-4 drop-shadow-md">
                Pose de Craque
              </h3>
              <p class="text-base sm:text-lg text-white/90 font-medium mb-6 leading-relaxed">
                Imite a pose do seu jogador favorito da copa e poste nas redes com a hashtag #SaborDoHexa.
              </p>

              <!-- Tags / Meta -->
              <div class="w-full flex justify-center gap-4 mb-8">
                <div class="flex flex-col items-center bg-white/5 rounded-xl px-4 py-2 border border-white/10">
                  <span class="text-[10px] uppercase tracking-wider text-white/50 mb-1 font-bold">Dificuldade</span>
                  <span class="text-sm font-black text-white uppercase italic drop-shadow-md">Fácil</span>
                </div>
                <div class="flex flex-col items-center bg-white/5 rounded-xl px-4 py-2 border border-white/10">
                  <span class="text-[10px] uppercase tracking-wider text-white/50 mb-1 font-bold">Tempo</span>
                  <span class="text-sm font-black text-white uppercase italic drop-shadow-md">Livre</span>
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="w-full flex flex-col gap-3">
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="relative w-full overflow-hidden rounded-full active:scale-95 transition-all duration-200">
                  <div class="relative bg-black/20 border border-white/20 backdrop-blur-sm w-full py-4 rounded-full flex items-center justify-center font-black italic uppercase tracking-wider text-white shadow-inner transition-colors duration-200 text-sm hover:bg-white/10">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                    ABRIR INSTAGRAM
                  </div>
                </a>
                <button onclick="completarDesafio()" class="relative w-full group overflow-hidden rounded-full p-[2px] active:scale-95 transition-all duration-200">
                  <span class="absolute inset-0 bg-gradient-to-r from-beats-yellow via-[#fff170] to-beats-yellow rounded-full opacity-80 group-hover:opacity-100 transition-opacity"></span>
                  <div class="relative bg-black/20 backdrop-blur-sm w-full py-4 rounded-full flex items-center justify-center font-black italic uppercase tracking-wider text-white shadow-inner group-hover:bg-transparent transition-colors duration-200">
                    DESAFIO CUMPRIDO
                  </div>
                </button>
              </div>
            </div>
          </div>

          <!-- Success Card (Hidden initially) -->
          <div id="success-card" class="hidden w-full flex-col items-center text-center bg-beats-yellow p-8 rounded-[2rem] shadow-[0_0_50px_rgba(232,213,51,0.3)] relative overflow-hidden transition-all duration-300">
             <svg class="w-20 h-20 text-[#0c310c] mb-6 drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <h3 class="text-3xl font-black italic uppercase tracking-tight text-[#0c310c] mb-2">
                AÍ SIM!
              </h3>
              <p class="text-[#0c310c]/80 font-black mb-8 text-xl">
                Obrigado por participar!
              </p>
              <button onclick="window.location.reload()" class="w-full bg-[#0c310c] text-white py-4 rounded-full font-black italic uppercase tracking-wider active:scale-95 transition-all duration-200 shadow-xl">
                REFAZER DESAFIO
              </button>
          </div>

        </div>
      </div>
    </div>

    <!-- Footer Section -->
    <footer class="shrink-0 flex justify-between items-end z-10 border-t border-white/10 pt-4 relative pb-2 w-full mt-4">
      <div class="flex items-end">
        <img src="./logo.png" alt="BEATS" class="h-5 sm:h-6 md:h-8 object-contain opacity-90" />
      </div>
      <div class="text-right pb-1">
        <p class="text-[9px] sm:text-[10px] font-medium uppercase tracking-[0.2em] opacity-60">
          Beba com moderação
        </p>
      </div>
    </footer>
  </main>

  <script>
    function completarDesafio() {
      const challengeCard = document.getElementById('challenge-card');
      challengeCard.classList.add('hidden');
      challengeCard.classList.remove('flex');
      
      const successCard = document.getElementById('success-card');
      successCard.classList.remove('hidden');
      successCard.classList.add('flex', 'animate-fadeIn');
    }
  </script>
</body>
</html>
